name: Manual Makefile Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Set up Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libglib2.0-dev \
            libx11-dev \
            libxkbcommon-dev \
            libssl-dev \
            zip

      - name: Build all binaries
        run: make build-all

      - name: Copy characters.json to build directory
        run: cp characters.json build/bin/

      - name: Create dist directory
        run: mkdir -p dist

      - name: Package Windows binary
        run: zip dist/Tsunagu-windows-amd64.zip build/bin/Tsunagu.exe build/bin/characters.json

      - name: Package Linux binary
        run: zip dist/Tsunagu-linux-amd64.zip build/bin/Tsunagu build/bin/characters.json

      - name: Get version (from git tag or fallback)
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "manual-$(date +%Y%m%d%H%M%S)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: |
            dist/Tsunagu-windows-amd64.zip
            dist/Tsunagu-linux-amd64.zip
