name: Release

# Publica un release con cada push a main (y también a mano desde la UI de
# Actions). Cada release lleva un tag único y los binarios de Windows/Linux
# empaquetados con characters.json, listos para el auto-update de la app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    # Ubuntu 24.04 ships webkit2gtk-4.1, the runtime that current distros
    # (Arch, Fedora, Ubuntu 24.04+) provide. The Makefile adds the matching
    # `webkit2_41` build tag automatically.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libx11-dev \
            libxkbcommon-dev \
            libssl-dev \
            zip \
            jq

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="build-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            TAG="${TAG}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION with tag $TAG"

      - name: Sync version metadata
        run: make sync-version VERSION=${{ steps.meta.outputs.version }}

      - name: Build all binaries
        run: make build-all VERSION=${{ steps.meta.outputs.version }} BUILD_TAG=${{ steps.meta.outputs.tag }}

      - name: Package binaries
        run: |
          mkdir -p dist
          zip dist/Tsunagu-windows-amd64.zip build/bin/Tsunagu.exe build/bin/characters.json
          zip dist/Tsunagu-linux-amd64.zip build/bin/Tsunagu build/bin/characters.json
          cd dist && sha256sum ./*.zip > checksums.sha256
          cat checksums.sha256

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Tsunagu ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag }})
          generate_release_notes: true
          files: |
            dist/Tsunagu-windows-amd64.zip
            dist/Tsunagu-linux-amd64.zip
            dist/checksums.sha256
